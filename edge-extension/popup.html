<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SJTU 场馆助手</title><link rel="stylesheet" href="style.css"><body>
<header><h1>SJTU 体育场馆助手</h1><p>查看空位 · 保存偏好 · 人工预约</p></header>
<div class="notice">平台须知禁止“外挂”预约。本助手不选中场地、不提交订单、不处理付款；预约请在官网按规则自行完成。</div>
<section><h2>预约偏好</h2><label>场馆<input id="venue" list="venues" placeholder="例如：霍英东体育中心"><datalist id="venues"></datalist></label><label>项目<input id="item" list="items" placeholder="例如：羽毛球"><datalist id="items"></datalist></label><label>日期<input id="date" type="date"></label><label>开始时间<input id="time" type="time" value="20:00"></label><label>场地名称（可选）<input id="site" placeholder="例如：场地7；留空表示任意场地"></label><button id="save">保存偏好</button><button id="catalog">读取页面选项</button></section>
<section><h2>页面操作</h2><button id="open">打开平台</button><button id="prepare">定位项目和日期</button><button id="read">读取并高亮空位</button><p>请先打开场馆详情页并登录。定位只切换项目与日期，不会点击场地或下单。橙色描边表示页面显示可选。</p></section>
<section><h2>页面变化提醒</h2><label><input id="watch" type="checkbox">启用空位提醒</label><label><input id="firstAvailable" type="checkbox" checked>首次读取已有空位也提醒</label><label><input id="sound" type="checkbox" checked>循环声音，直到确认</label><button id="apply">应用提醒设置</button><button id="test">测试提醒</button><button id="ack">已收到／停止声音</button><p>只观察已加载页面及其变化，不自动刷新抢位。余位是否最新取决于平台页面更新，必要时请手动刷新。</p></section>
<p id="message" role="status"></p><section><h2>读取结果</h2><div id="result">尚未读取</div></section><section><h2>最近日志</h2><button id="export">导出日志</button><div id="logs"></div></section><footer>仅支持 sports.sjtu.edu.cn。会话复用当前 Edge；过期时手动登录。最终场次、价格和预约结果以官网为准。</footer><script src="core.js"></script><script src="popup.js"></script></body></html>
